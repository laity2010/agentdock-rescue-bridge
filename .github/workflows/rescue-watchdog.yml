name: AgentDock Rescue Watchdog

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduler congestion.
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentdock-rescue-watchdog
  cancel-in-progress: false

jobs:
  rescue-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ask Mac rescue bridge to self-check
        shell: bash
        run: |
          set -euo pipefail

          RESCUE_URL='https://rescue.laity.xx.kg/rescue'
          STATUS_URL='https://rescue.laity.xx.kg/status'

          code="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            -H 'User-Agent: AgentDock-Rescue-Watchdog/1.0' \
            -o /tmp/rescue.json -w '%{http_code}' \
            "$RESCUE_URL")"

          echo "rescue_http=$code"
          cat /tmp/rescue.json
          echo

          jq -e '.ok == true' /tmp/rescue.json >/dev/null
          reason="$(jq -r '.reason // ""' /tmp/rescue.json)"
          accepted="$(jq -r '.accepted // false' /tmp/rescue.json)"

          if [[ "$code" == "200" && "$accepted" == "false" && "$reason" == "agentdock_healthy" ]]; then
            echo 'AgentDock is healthy; no rescue needed.'
            exit 0
          fi

          if [[ "$code" != "202" && "$code" != "429" && "$accepted" != "true" ]]; then
            echo "Unexpected rescue response: HTTP $code reason=$reason accepted=$accepted" >&2
            exit 1
          fi

          echo "Rescue path active (reason=$reason accepted=$accepted). Polling for recovery..."
          for attempt in $(seq 1 12); do
            sleep 15
            status_code="$(curl --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              --retry 1 --retry-delay 2 --retry-all-errors \
              -H 'User-Agent: AgentDock-Rescue-Watchdog/1.0' \
              -o /tmp/status.json -w '%{http_code}' \
              "$STATUS_URL")" || true
            echo "status_attempt=$attempt http=$status_code"
            cat /tmp/status.json 2>/dev/null || true
            echo
            if [[ "$status_code" == "200" ]] && jq -e '.agentdock_healthy == true' /tmp/status.json >/dev/null 2>&1; then
              echo 'AgentDock recovered.'
              exit 0
            fi
          done

          echo 'AgentDock did not recover within the watchdog window.' >&2
          exit 1
