name: Rescue Watchdog Keepalive

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rescue-watchdog-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record monthly repository activity
        shell: bash
        run: |
          set -euo pipefail
          date -u '+%Y-%m' > .watchdog-keepalive
          if [[ -z "$(git status --porcelain -- .watchdog-keepalive)" ]]; then
            echo 'Heartbeat already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .watchdog-keepalive
          git commit -m 'chore: keep rescue watchdog scheduled'
          git push
